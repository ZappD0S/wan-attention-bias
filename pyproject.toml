[dependency-groups]
dev = [
  "ipykernel",
  "jupyterlab",
  "ruff",
  "xeus-python",
]
cuda = [
  "sam2>=1.1.0",
]

[tool.pyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "UP", "PL", "C4", "SIM", "RUF", "TID",
]

ignore = [
    "PLR0913", "B008", "PLW0602", "PLW0603", "PLR2004", "E501", "E741",
]

[tool.uv]
config-settings = { editable_mode = "compat" }
no-build-isolation-package = ["sam2"]

[tool.uv.extra-build-variables]
sam2 = { SAM2_BUILD_ALLOW_ERRORS = "0" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.workspace]
members = [
    "wan2.1",
    "lama",
]

[tool.uv.sources]
wan = { workspace = true, editable = true }
lama-inpainting = { workspace = true, editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchcodec = { index = "pytorch-cu128" }
