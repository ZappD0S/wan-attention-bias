[tool.pyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors (standard)
    "F",    # Pyflakes (standard)
    "I",    # isort (keeps imports organized)
    "B",    # flake8-bugbear (essential: catches logic bugs & design flaws)
    "UP",   # pyupgrade (keeps code modern: e.g., converts old syntax to 3.10+)
    "PL",   # Pylint (catches the "leakage" and "redefinition" issues)
    "C4",   # flake8-comprehensions (helps you use list/dict comprehensions better)
    "SIM",  # flake8-simplify (helps you write cleaner, less bug-prone logic)
    "RUF",  # Ruff-specific rules (catches common mistakes in the linter itself)
    "TID",  # flake8-tidy-imports (prevents messy/circular imports)
]

ignore = [
    "PLR0913", # Too many arguments in function (sometimes necessary)
    "B008",    # Do not perform function call in argument defaults (too strict for FastAPI/Typer)
]

[tool.uv]
config-settings = { editable_mode = "compat" }

[tool.uv.workspace]
members = [
    "wan2.1",
    "lama",
]

[tool.uv.sources]
wan = { workspace = true, editable = true }
lama-inpainting = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "ipykernel",
    "jupyterlab",
    "ruff",
    "xeus-python",
]
