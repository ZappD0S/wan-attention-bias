[tool.pyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100

[tool.uv]
config-settings = { editable_mode = "compat" }

[tool.uv.workspace]
members = [
    "wan2.1",
]

[tool.uv.sources]
wan = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "ipykernel",
    "jupyterlab",
    "ruff",
    "xeus-python",
]
